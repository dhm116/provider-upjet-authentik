apiVersion: stage.authentik.m.goauthentik.io/v1alpha1
kind: AccountLockdown
metadata:
  annotations:
    meta.upbound.io/example-id: stage/v1alpha1/accountlockdown
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: upbound-system
spec:
  forProvider:
    deactivateUser: true
    deleteSessions: true
    name: account-lockdown
    revokeTokens: true
    setUnusablePassword: true
