apiVersion: policy.authentik.m.goauthentik.io/v1alpha1
kind: Binding
metadata:
  annotations:
    meta.upbound.io/example-id: policy/v1alpha1/binding
  labels:
    testing.upbound.io/example-name: app-access
  name: app-access
  namespace: upbound-system
spec:
  forProvider:
    order: 0
    policySelector:
      matchLabels:
        testing.upbound.io/example-name: policy
    targetSelector:
      matchLabels:
        testing.upbound.io/example-name: name

---

apiVersion: application.authentik.m.goauthentik.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: policy/v1alpha1/binding
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: upbound-system
spec:
  forProvider:
    name: test app
    slug: test-app

---

apiVersion: policy.authentik.m.goauthentik.io/v1alpha1
kind: Expression
metadata:
  annotations:
    meta.upbound.io/example-id: policy/v1alpha1/binding
  labels:
    testing.upbound.io/example-name: policy
  name: policy
  namespace: upbound-system
spec:
  forProvider:
    expression: return True
    name: example
