apiVersion: provider.authentik.m.goauthentik.io/v1alpha1
kind: Oauth2
metadata:
  annotations:
    meta.upbound.io/example-id: provider/v1alpha1/oauth2
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: upbound-system
spec:
  forProvider:
    allowedRedirectUris:
    - matching_mode: strict
      url: http://localhost
    clientId: grafana
    name: grafana

---

apiVersion: application.authentik.m.goauthentik.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: provider/v1alpha1/oauth2
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: upbound-system
spec:
  forProvider:
    name: test app
    protocolProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    slug: test-app
