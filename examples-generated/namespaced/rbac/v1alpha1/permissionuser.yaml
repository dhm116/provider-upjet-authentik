apiVersion: rbac.authentik.m.goauthentik.io/v1alpha1
kind: PermissionUser
metadata:
  annotations:
    meta.upbound.io/example-id: rbac/v1alpha1/permissionuser
  labels:
    testing.upbound.io/example-name: global-permission
  name: global-permission
  namespace: upbound-system
spec:
  forProvider:
    permission: authentik_flows.inspect_flow
    userSelector:
      matchLabels:
        testing.upbound.io/example-name: name

---

apiVersion: flow.authentik.m.goauthentik.io/v1alpha1
kind: Flow
metadata:
  annotations:
    meta.upbound.io/example-id: rbac/v1alpha1/permissionuser
  labels:
    testing.upbound.io/example-name: flow
  name: flow
  namespace: upbound-system
spec:
  forProvider:
    designation: authorization
    name: test-flow
    slug: test-flow
    title: Test flow

---

apiVersion: authentik.authentik.m.goauthentik.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: rbac/v1alpha1/permissionuser
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: upbound-system
spec:
  forProvider:
    name: User
    username: user
