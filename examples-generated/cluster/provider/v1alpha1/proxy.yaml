apiVersion: provider.authentik.goauthentik.io/v1alpha1
kind: Proxy
metadata:
  annotations:
    meta.upbound.io/example-id: provider/v1alpha1/proxy
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    authorizationFlow: ${data.authentik_flow.default-authorization-flow.id}
    externalHost: http://internal.service
    internalHost: http://foo.bar.baz
    name: test-app

---

apiVersion: application.authentik.goauthentik.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: provider/v1alpha1/proxy
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    name: test-app
    protocolProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    slug: test-app
